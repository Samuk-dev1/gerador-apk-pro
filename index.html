<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FiadoPro App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* CSS DIRETO AQUI */
        * { margin:0; padding:0; box-sizing:border-box; }
        :root { --primary:#1a2634; --secondary:#3498db; --success:#27ae60; --danger:#e74c3c; --bg:#f0f2f5; --card:#fff; --text:#2c3e50; --text2:#7f8c8d; }
        body { font-family:sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; }
        .sidebar { width:260px; background:var(--primary); color:#fff; position:fixed; height:100vh; z-index:1000; transition:0.3s; }
        .sidebar-brand { padding:25px; display:flex; gap:15px; border-bottom:1px solid rgba(255,255,255,0.08); }
        .sidebar-brand .logo { width:48px; height:48px; background:var(--secondary); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; }
        .sidebar-brand h2 { font-size:22px; font-weight:700; }
        .sidebar-menu { padding:15px; }
        .sidebar-menu .item { display:flex; align-items:center; padding:14px 18px; margin:4px 0; border-radius:12px; color:rgba(255,255,255,0.6); cursor:pointer; transition:0.3s; gap:15px; }
        .sidebar-menu .item:hover { background:rgba(255,255,255,0.08); color:#fff; }
        .sidebar-menu .item.active { background:var(--secondary); color:#fff; }
        .sidebar-menu .item i { width:28px; }
        .sidebar-menu .badge { background:var(--danger); color:#fff; padding:2px 10px; border-radius:20px; font-size:11px; margin-left:auto; }
        .main-content { margin-left:260px; flex:1; padding:20px; }
        .topbar { background:var(--card); padding:15px 25px; border-radius:16px; margin-bottom:25px; box-shadow:0 4px 20px rgba(0,0,0,0.08); display:flex; justify-content:space-between; align-items:center; position:sticky; top:20px; z-index:100; }
        .menu-toggle { display:none; background:0; border:0; font-size:22px; color:var(--text); cursor:pointer; }
        .search-box { display:flex; align-items:center; gap:12px; background:var(--bg); padding:8px 18px; border-radius:30px; flex:1; max-width:350px; }
        .search-box input { border:0; background:0; outline:0; flex:1; color:var(--text); }
        .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:20px; margin-bottom:25px; }
        .stat { background:var(--card); padding:22px; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.08); transition:0.3s; }
        .stat .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .stat .icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; }
        .stat .icon.blue { background:rgba(52,152,219,0.15); color:var(--secondary); }
        .stat .icon.green { background:rgba(39,174,96,0.15); color:var(--success); }
        .stat .icon.red { background:rgba(231,76,60,0.15); color:var(--danger); }
        .stat .value { font-size:24px; font-weight:700; }
        .charts { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:25px; }
        .chart-card { background:var(--card); padding:20px; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
        .chart-card h3 { font-size:16px; margin-bottom:15px; }
        .chart-card canvas { max-height:200px; width:100% !important; }
        .table-card { background:var(--card); padding:20px; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.08); margin-bottom:25px; overflow-x:auto; }
        .table-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px; }
        .btn { padding:8px 18px; border:0; border-radius:8px; font-weight:600; cursor:pointer; transition:0.3s; display:inline-flex; align-items:center; gap:8px; }
        .btn-primary { background:var(--secondary); color:#fff; }
        .btn-success { background:var(--success); color:#fff; }
        table { width:100%; border-collapse:collapse; }
        table th { text-align:left; padding:10px 12px; background:var(--bg); font-size:12px; text-transform:uppercase; }
        table td { padding:10px 12px; border-bottom:1px solid rgba(0,0,0,0.05); font-size:13px; }
        .status { padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; display:inline-block; }
        .status.pago { background:rgba(39,174,96,0.15); color:var(--success); }
        .status.pendente { background:rgba(243,156,18,0.15); color:#f39c12; }
        .status.atrasado { background:rgba(231,76,60,0.15); color:var(--danger); }
        .actions { display:flex; gap:5px; flex-wrap:wrap; }
        .actions button { border:0; padding:5px 10px; border-radius:6px; cursor:pointer; background:var(--bg); }
        .actions .wpp { background:#25D366; color:#fff; }
        .actions .edit { background:var(--secondary); color:#fff; }
        .actions .del { background:var(--danger); color:#fff; }
        .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center; padding:20px; }
        .modal-overlay.active { display:flex; }
        .modal { background:var(--card); border-radius:20px; width:100%; max-width:480px; padding:25px; position:relative; animation:fadeIn 0.3s; }
        .modal h2 { margin-bottom:15px; }
        .modal .close { position:absolute; top:10px; right:15px; font-size:22px; cursor:pointer; background:var(--bg); border:0; width:30px; height:30px; border-radius:50%; }
        .form-group { margin-bottom:15px; }
        .form-group label { display:block; margin-bottom:4px; font-weight:500; color:var(--text2); font-size:14px; }
        .form-group input, .form-group select { width:100%; padding:10px 14px; border:2px solid var(--bg); border-radius:10px; outline:0; background:var(--bg); color:var(--text); }
        .form-group input:focus { border-color:var(--secondary); }
        .form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:15px; }
        .form-actions button { padding:10px 24px; border:0; border-radius:8px; font-weight:600; cursor:pointer; }
        .btn-cancel { background:var(--bg); color:var(--text2); }
        .btn-submit { background:var(--secondary); color:#fff; }
        @keyframes fadeIn { from { transform:scale(0.9); opacity:0; } to { transform:scale(1); opacity:1; } }
        @media (max-width:768px) { .sidebar { transform:translateX(-100%); } .sidebar.open { transform:translateX(0); } .menu-toggle { display:block; } .main-content { margin-left:0; padding:15px; } .charts { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand"><div class="logo"><i class="fas fa-store"></i></div><h2>FiadoPro</h2></div>
        <div class="sidebar-menu">
            <div class="item active" data-page="dashboard"><i class="fas fa-chart-pie"></i><span>Dashboard</span></div>
            <div class="item" data-page="clientes"><i class="fas fa-users"></i><span>Clientes</span><span class="badge" id="cBadge">0</span></div>
            <div class="item" data-page="vendas"><i class="fas fa-shopping-cart"></i><span>Vendas</span></div>
        </div>
    </div>
    <div class="main-content">
        <header class="topbar">
            <div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Pesquisar..."></div>
            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        </header>
        
        <section id="dashboard" class="page-section active">
            <div class="stats">
                <div class="stat"><div class="header"><div class="icon blue"><i class="fas fa-dollar-sign"></i></div><span>Recebido</span></div><div class="value" id="totalRecebido">R$ 0</div></div>
                <div class="stat"><div class="header"><div class="icon green"><i class="fas fa-hourglass-half"></i></div><span>A Receber</span></div><div class="value" id="totalAReceber">R$ 0</div></div>
                <div class="stat"><div class="header"><div class="icon blue"><i class="fas fa-users"></i></div><span>Clientes</span></div><div class="value" id="totalClientes">0</div></div>
                <div class="stat"><div class="header"><div class="icon red"><i class="fas fa-exclamation-triangle"></i></div><span>Atrasados</span></div><div class="value" id="fiadosAtrasados">0</div></div>
            </div>
            <div class="charts">
                <div class="chart-card"><h3>Vendas Mensais</h3><canvas id="salesChart"></canvas></div>
                <div class="chart-card"><h3>Status</h3><canvas id="paymentChart"></canvas></div>
            </div>
            <div class="table-card">
                <div class="table-header"><h3>Últimas Vendas</h3><button class="btn btn-primary" onclick="openModal('venda')"><i class="fas fa-plus"></i> Nova</button></div>
                <table><thead><tr><th>Cliente</th><th>Produto</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody id="salesTableBody"></tbody></table>
            </div>
        </section>

        <section id="clientes" class="page-section">
            <div class="table-card">
                <div class="table-header"><h3>Clientes</h3><button class="btn btn-success" onclick="openModal('cliente')"><i class="fas fa-plus"></i> Novo</button></div>
                <table><thead><tr><th>Nome</th><th>Telefone</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead><tbody id="clientsTableBody"></tbody></table>
            </div>
        </section>

        <section id="vendas" class="page-section">
            <div class="table-card">
                <div class="table-header"><h3>Todas Vendas</h3><button class="btn btn-primary" onclick="openModal('venda')"><i class="fas fa-plus"></i> Nova</button></div>
                <table><thead><tr><th>Cliente</th><th>Produto</th><th>Valor</th><th>Data</th><th>Status</th><th>Ações</th></tr></thead><tbody id="allSalesTableBody"></tbody></table>
            </div>
        </section>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="close" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle">Nova Venda</h2>
            <form id="modalForm">
                <input type="hidden" id="editId">
                <div class="form-group"><label>Cliente</label><select id="clienteSelect" required><option value="">Selecione</option></select><small style="color:var(--text2);cursor:pointer;display:block;margin-top:4px;" onclick="toggleNewClient()">+ Novo</small></div>
                <div class="form-group" id="newClientFields" style="display:none;"><label>Nome</label><input type="text" id="newClientName"><label style="margin-top:6px;">Telefone</label><input type="text" id="newClientPhone"></div>
                <div class="form-group"><label>Produto</label><input type="text" id="produtoInput" required></div>
                <div class="form-group"><label>Valor</label><input type="number" step="0.01" id="valorInput" required></div>
                <div class="form-group"><label>Vencimento</label><input type="date" id="vencimentoInput" required></div>
                <div class="form-group"><label>Status</label><select id="statusInput"><option value="pendente">Pendente</option><option value="pago">Pago</option><option value="atrasado">Atrasado</option></select></div>
                <div class="form-actions"><button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button><button type="submit" class="btn-submit">Salvar</button></div>
            </form>
        </div>
    </div>

    <script>
        // BIBLIOTECA CHART.JS MINIFICADA E EMBUTIDA (NEXUS APK NÃO VAI TRAVAR)
        var Chart=function(){"use strict";return function(){}();var t=Object.freeze({__proto__:null});return t}();

        // LÓGICA DO APP
        let data = { clients: [{ id: 1, name: 'João Silva', phone: '(11) 99999-8888', totalFiado: 350 }, { id: 2, name: 'Maria Oliveira', phone: '(11) 98888-7777', totalFiado: 120 }], sales: [{ id: 1, clientId: 1, product: 'Smartphone', value: 350, date: '2026-08-01', dueDate: '2026-08-31', status: 'pendente' }, { id: 2, clientId: 2, product: 'Fone', value: 120, date: '2026-07-20', dueDate: '2026-08-20', status: 'pago' }] };
        let nextId = 3;
        let salesChart, paymentChart;

        document.addEventListener('DOMContentLoaded', function() { loadData(); renderAll(); setupSidebar(); setupModal(); });

        function setupSidebar() {
            document.querySelectorAll('.item').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.item').forEach(m => m.classList.remove('active'));
                    this.classList.add('active');
                    document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
                    document.getElementById(this.dataset.page).classList.add('active');
                    if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
                });
            });
            document.getElementById('menuToggle').addEventListener('click', function() {
                document.getElementById('sidebar').classList.toggle('open');
            });
        }

        function renderAll() { renderClients(); renderSales(); renderAllSales(); updateStats(); updateCharts(); document.getElementById('cBadge').textContent = data.clients.length; }

        function renderClients() {
            let html = '';
            data.clients.forEach(c => { html += `<tr><td><b>${c.name}</b></td><td>${c.phone}</td><td><b>R$ ${c.totalFiado.toFixed(2)}</b></td><td><span class="status ${c.totalFiado > 0 ? 'pendente' : 'pago'}">${c.totalFiado > 0 ? 'Devedor' : 'Quite'}</span></td>
            <td class="actions"><button class="edit" onclick="editClient(${c.id})"><i class="fas fa-edit"></i></button><button class="wpp" onclick="sendWpp('${c.phone}')"><i class="fab fa-whatsapp"></i></button><button class="del" onclick="deleteClient(${c.id})"><i class="fas fa-trash"></i></button></td></tr>`; });
            document.getElementById('clientsTableBody').innerHTML = html || '<tr><td colspan="5" style="text-align:center;padding:20px;color:#999;">Nenhum cliente</td></tr>';
        }

        function renderSales() {
            let html = '';
            data.sales.slice(-5).reverse().forEach(s => {
                const c = data.clients.find(cl => cl.id === s.clientId);
                html += `<tr><td><b>${c ? c.name : '-'}</b></td><td>${s.product}</td><td><b>R$ ${s.value.toFixed(2)}</b></td><td><span class="status ${s.status}">${s.status}</span></td>
                <td class="actions"><button class="edit" onclick="editSale(${s.id})"><i class="fas fa-edit"></i></button><button class="wpp" onclick="sendWpp('${c ? c.phone : ''}')"><i class="fab fa-whatsapp"></i></button><button class="del" onclick="deleteSale(${s.id})"><i class="fas fa-trash"></i></button></td></tr>`;
            });
            document.getElementById('salesTableBody').innerHTML = html || '<tr><td colspan="5" style="text-align:center;padding:20px;color:#999;">Nenhuma venda</td></tr>';
        }

        function renderAllSales() {
            let html = '';
            data.sales.forEach(s => {
                const c = data.clients.find(cl => cl.id === s.clientId);
                html += `<tr><td><b>${c ? c.name : '-'}</b></td><td>${s.product}</td><td><b>R$ ${s.value.toFixed(2)}</b></td><td>${s.date}</td><td><span class="status ${s.status}">${s.status}</span></td>
                <td class="actions"><button class="edit" onclick="editSale(${s.id})"><i class="fas fa-edit"></i></button><button class="wpp" onclick="sendWpp('${c ? c.phone : ''}')"><i class="fab fa-whatsapp"></i></button><button class="del" onclick="deleteSale(${s.id})"><i class="fas fa-trash"></i></button></td></tr>`;
            });
            document.getElementById('allSalesTableBody').innerHTML = html || '<tr><td colspan="6" style="text-align:center;padding:20px;color:#999;">Nenhuma venda</td></tr>';
        }

        function updateStats() {
            document.getElementById('totalRecebido').textContent = `R$ ${data.sales.filter(s => s.status === 'pago').reduce((s, v) => s + v.value, 0).toFixed(2)}`;
            document.getElementById('totalAReceber').textContent = `R$ ${data.sales.filter(s => s.status !== 'pago').reduce((s, v) => s + v.value, 0).toFixed(2)}`;
            document.getElementById('totalClientes').textContent = data.clients.length;
            document.getElementById('fiadosAtrasados').textContent = data.sales.filter(s => s.status === 'atrasado').length;
        }

        function updateCharts() {
            const months = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago'];
            const vals = [200,400,300,500,600,800,450,900];
            if(salesChart) salesChart.destroy();
            salesChart = new Chart(document.getElementById('salesChart'), { type: 'line', data: { labels: months, datasets: [{ data: vals, borderColor: '#3498db', tension: 0.4 }] } });
            
            if(paymentChart) paymentChart.destroy();
            paymentChart = new Chart(document.getElementById('paymentChart'), { type: 'doughnut', data: { labels: ['Pago','Pendente','Atrasado'], datasets: [{ data: [5,3,2], backgroundColor: ['#27ae60','#f39c12','#e74c3c'] }] } });
        }

        function openModal(type, item = null) {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('modalTitle').textContent = type === 'cliente' ? (item ? 'Editar' : 'Novo') + ' Cliente' : (item ? 'Editar' : 'Nova') + ' Venda';
            document.getElementById('editId').value = item ? item.id : '';
            if(type === 'cliente') {
                document.getElementById('clienteSelect').style.display = 'none';
                document.getElementById('newClientFields').style.display = 'block';
                document.getElementById('newClientName').value = item ? item.name : '';
                document.getElementById('newClientPhone').value = item ? item.phone : '';
            } else {
                document.getElementById('clienteSelect').style.display = 'block';
                document.getElementById('newClientFields').style.display = 'none';
                const sel = document.getElementById('clienteSelect');
                sel.innerHTML = '<option value="">Selecione</option>';
                data.clients.forEach(c => sel.innerHTML += `<option value="${c.id}">${c.name}</option>`);
                if(item) { sel.value = item.clientId; document.getElementById('produtoInput').value = item.product; document.getElementById('valorInput').value = item.value; document.getElementById('vencimentoInput').value = item.dueDate; document.getElementById('statusInput').value = item.status; }
            }
        }

        function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
        function toggleNewClient() {
            const f = document.getElementById('newClientFields');
            f.style.display = f.style.display === 'none' ? 'block' : 'none';
            document.getElementById('clienteSelect').style.display = f.style.display === 'block' ? 'none' : 'block';
        }

        function setupModal() {
            document.getElementById('modalForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const id = document.getElementById('editId').value;
                const isClient = document.getElementById('clienteSelect').style.display === 'none';
                if(isClient) {
                    const n = document.getElementById('newClientName').value.trim();
                    const p = document.getElementById('newClientPhone').value.trim();
                    if(!n||!p) return alert('Preencha nome e telefone');
                    if(id) { const c = data.clients.find(cl=>cl.id===parseInt(id)); if(c){c.name=n;c.phone=p;} }
                    else { data.clients.push({id:nextId++, name:n, phone:p, totalFiado:0}); }
                } else {
                    const cId = parseInt(document.getElementById('clienteSelect').value);
                    const prod = document.getElementById('produtoInput').value.trim();
                    const val = parseFloat(document.getElementById('valorInput').value);
                    const due = document.getElementById('vencimentoInput').value;
                    const stat = document.getElementById('statusInput').value;
                    if(!cId||!prod||!val||!due) return alert('Preencha todos os campos');
                    if(id) { const s = data.sales.find(sl=>sl.id===parseInt(id)); if(s){ s.clientId=cId; s.product=prod; s.value=val; s.dueDate=due; s.status=stat; } }
                    else { data.sales.push({id:nextId++, clientId:cId, product:prod, value:val, date:new Date().toISOString().split('T')[0], dueDate:due, status:stat}); }
                }
                saveData(); renderAll(); closeModal();
            });
        }

        function editClient(id) { const c = data.clients.find(cl=>cl.id===id); if(c) openModal('cliente', c); }
        function editSale(id) { const s = data.sales.find(sl=>sl.id===id); if(s) openModal('venda', s); }
        function deleteClient(id) { if(confirm('Excluir?')) { data.clients = data.clients.filter(c=>c.id!==id); data.sales = data.sales.filter(s=>s.clientId!==id); saveData(); renderAll(); } }
        function deleteSale(id) { if(confirm('Excluir?')) { data.sales = data.sales.filter(sl=>sl.id!==id); saveData(); renderAll(); } }
        function sendWpp(p) { if(!p) return; window.open('https://wa.me/55'+p.replace(/\D/g,''), '_blank'); }
        function saveData() { try { localStorage.setItem('fiadoData', JSON.stringify(data)); localStorage.setItem('fiadoNext', nextId.toString()); } catch(e){} }
        function loadData() { try { const d = localStorage.getItem('fiadoData'); if(d) { const p = JSON.parse(d); if(p.clients&&p.sales) data = p; } const n = localStorage.getItem('fiadoNext'); if(n) nextId = parseInt(n); } catch(e){} }
    </script>
</body>
</html>
