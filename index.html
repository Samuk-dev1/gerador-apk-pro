<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FiadoApp - Controle de Vendas</title>
    <!-- Tailwind CSS para um visual moderno e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Ajustes para parecer aplicativo nativo */
        body {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .hide { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased flex flex-col h-screen overflow-hidden">

    <!-- CABEÇALHO -->
    <header class="bg-blue-600 text-white shadow-md p-4 flex justify-between items-center z-10">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-book-open"></i> Fiado<span class="text-blue-200">App</span>
        </h1>
        <button onclick="abrirModalConfig()" class="text-white focus:outline-none">
            <i class="fa-solid fa-gear text-xl"></i>
        </button>
    </header>

    <!-- CONTEÚDO PRINCIPAL (TELAS) -->
    <main class="flex-1 overflow-y-auto p-4 pb-20 relative" id="main-container">

        <!-- TELA 1: DASHBOARD / CLIENTES -->
        <section id="tela-home" class="space-y-4">
            <!-- Cards Resumo -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-xs text-gray-500 font-medium uppercase">Total em Aberto</p>
                    <p class="text-lg font-bold text-red-600 mt-1" id="total-geral-divida">R$ 0,00</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-xs text-gray-500 font-medium uppercase">Clientes Devedores</p>
                    <p class="text-lg font-bold text-blue-600 mt-1" id="total-clientes-devedores">0</p>
                </div>
            </div>

            <!-- Barra de Pesquisa e Botão Novo -->
            <div class="flex gap-2">
                <div class="relative flex-1">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="busca-cliente" placeholder="Buscar cliente..." 
                           class="w-full pl-10 pr-4 py-2 bg-white border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <button onclick="abrirModalCliente()" class="bg-blue-600 text-white px-4 py-2 rounded-xl shadow hover:bg-blue-700 flex items-center justify-center">
                    <i class="fa-solid fa-user-plus"></i>
                </button>
            </div>

            <!-- Lista de Clientes -->
            <div class="space-y-2" id="lista-clientes">
                <!-- Inserido via JavaScript -->
            </div>
        </section>

        <!-- TELA 2: DETALHES DO CLIENTE / FIADOS -->
        <section id="tela-detalhes" class="space-y-4 hide">
            <div class="flex items-center justify-between bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <div>
                    <button onclick="voltarHome()" class="text-blue-600 text-sm font-semibold flex items-center gap-1 mb-1">
                        <i class="fa-solid fa-arrow-left"></i> Voltar
                    </button>
                    <h2 class="text-xl font-bold text-gray-800" id="detalhe-nome">Nome do Cliente</h2>
                    <p class="text-xs text-gray-500" id="detalhe-telefone">(00) 00000-0000</p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-gray-500">Devendo</p>
                    <p class="text-lg font-bold text-red-600" id="detalhe-divida">R$ 0,00</p>
                </div>
            </div>

            <!-- Botões de Ação Rápida -->
            <div class="grid grid-cols-2 gap-2">
                <button onclick="abrirModalNovaCompra()" class="bg-red-600 text-white py-3 rounded-xl shadow font-semibold text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cart-plus"></i> Novo Fiado
                </button>
                <button onclick="abrirModalPagamento()" class="bg-green-600 text-white py-3 rounded-xl shadow font-semibold text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cash-register"></i> Registrar Pagamento
                </button>
            </div>

            <!-- Histórico de Transações -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                <h3 class="font-bold text-gray-700 mb-3 text-sm uppercase tracking-wider">Histórico de Transações</h3>
                <div class="space-y-3" id="lista-transacoes">
                    <!-- Inserido via JavaScript -->
                </div>
            </div>
        </section>

    </main>

    <!-- RODAPÉ / MENU INFERIOR -->
    <nav class="bg-white border-t border-gray-200 py-3 px-6 flex justify-around items-center fixed bottom-0 left-0 right-0 z-10 shadow-lg">
        <button onclick="voltarHome()" class="flex flex-col items-center text-blue-600 focus:outline-none" id="nav-home">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-xs mt-1 font-medium">Início</span>
        </button>
        <button onclick="abrirModalCliente()" class="flex flex-col items-center text-gray-400 focus:outline-none">
            <i class="fa-solid fa-user-plus text-lg"></i>
            <span class="text-xs mt-1 font-medium">Novo Cliente</span>
        </button>
    </nav>

    <!-- MODAIS -->

    <!-- Modal: Adicionar/Editar Cliente -->
    <div id="modal-cliente" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-gray-800" id="titulo-modal-cliente">Adicionar Cliente</h3>
            <input type="hidden" id="cliente-id">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nome Completo</label>
                <input type="text" id="input-nome" class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Telefone / WhatsApp</label>
                <input type="tel" id="input-telefone" class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="fecharModalCliente()" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-xl font-semibold text-sm">Cancelar</button>
                <button onclick="salvarCliente()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-semibold text-sm shadow">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Modal: Novo Fiado (Compra) -->
    <div id="modal-compra" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-gray-800">Adicionar Fiado</h3>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Descrição (O que comprou?)</label>
                <input type="text" id="input-descricao-compra" placeholder="Ex: 2x Refrigerante, 1x Pão" class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Valor (R$)</label>
                <input type="number" step="0.01" id="input-valor-compra" placeholder="0,00" class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="fecharModalNovaCompra()" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-xl font-semibold text-sm">Cancelar</button>
                <button onclick="salvarCompra()" class="flex-1 bg-red-600 text-white py-3 rounded-xl font-semibold text-sm shadow">Adicionar</button>
            </div>
        </div>
    </div>

    <!-- Modal: Registrar Pagamento -->
    <div id="modal-pagamento" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-gray-800">Registrar Pagamento</h3>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Valor do Pagamento (R$)</label>
                <input type="number" step="0.01" id="input-valor-pagamento" placeholder="0,00" class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="fecharModalPagamento()" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-xl font-semibold text-sm">Cancelar</button>
                <button onclick="salvarPagamento()" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-semibold text-sm shadow">Receber</button>
            </div>
        </div>
    </div>

    <!-- Modal: Configurações / Backup -->
    <div id="modal-config" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-gray-800">Configurações</h3>
            <p class="text-xs text-gray-500">Faça backup dos seus dados para não perder nada caso desinstale o app.</p>
            <div class="space-y-2">
                <button onclick="exportarDados()" class="w-full bg-blue-50 text-blue-600 border border-blue-200 py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i> Exportar Dados (Backup)
                </button>
            </div>
            <div class="pt-2">
                <button onclick="fecharModalConfig()" class="w-full bg-gray-200 text-gray-700 py-3 rounded-xl font-semibold text-sm">Fechar</button>
            </div>
        </div>
    </div>

    <!-- LÓGICA DO SISTEMA -->
    <script>
        // Banco de Dados Local (LocalStorage)
        let dadosApp = JSON.parse(localStorage.getItem('fiado_app_data')) || { clientes: [] };
        let clienteAtualId = null;

        function salvarDados() {
            localStorage.setItem('fiado_app_data', JSON.stringify(dadosApp));
            atualizarDashboard();
        }

        // Formatação de Moeda
        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        // --- TELA & NAVEGAÇÃO ---
        function voltarHome() {
            document.getElementById('tela-detalhes').classList.add('hide');
            document.getElementById('tela-home').classList.remove('hide');
            clienteAtualId = null;
            renderizarClientes();
            atualizarDashboard();
        }

        function abrirDetalhesCliente(id) {
            clienteAtualId = id;
            document.getElementById('tela-home').classList.add('hide');
            document.getElementById('tela-detalhes').classList.remove('hide');
            renderizarDetalhesCliente();
        }

        // --- DASHBOARD & CLIENTES ---
        function atualizarDashboard() {
            let totalGeral = 0;
            let qtdDevedores = 0;

            dadosApp.clientes.forEach(c => {
                let saldo = calcularSaldoCliente(c);
                totalGeral += saldo;
                if (saldo > 0) qtdDevedores++;
            });

            document.getElementById('total-geral-divida').innerText = formatarMoeda(totalGeral);
            document.getElementById('total-clientes-devedores').innerText = qtdDevedores;
            renderizarClientes();
        }

        function calcularSaldoCliente(cliente) {
            let total = 0;
            if (!cliente.transacoes) return 0;
            cliente.transacoes.forEach(t => {
                if (t.tipo === 'compra') total += t.valor;
                if (t.tipo === 'pagamento') total -= t.valor;
            });
            return total > 0 ? total : 0;
        }

        function renderizarClientes(filtro = '') {
            const lista = document.getElementById('lista-clientes');
            lista.innerHTML = '';

            const clientesFiltrados = dadosApp.clientes.filter(c => 
                c.nome.toLowerCase().includes(filtro.toLowerCase())
            );

            if (clientesFiltrados.length === 0) {
                lista.innerHTML = `<div class="text-center py-10 text-gray-400 text-sm">Nenhum cliente encontrado</div>`;
                return;
            }

            clientesFiltrados.forEach(c => {
                let saldo = calcularSaldoCliente(c);
                let div = document.createElement('div');
                div.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center cursor-pointer active:bg-gray-50";
                div.onclick = () => abrirDetalhesCliente(c.id);
                div.innerHTML = `
                    <div>
                        <h4 class="font-bold text-gray-800 text-base">${c.nome}</h4>
                        <p class="text-xs text-gray-500">${c.telefone || 'Sem telefone'}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-semibold px-2 py-1 rounded-full ${saldo > 0 ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}">
                            ${formatarMoeda(saldo)}
                        </span>
                    </div>
                `;
                lista.appendChild(div);
            });
        }

        // Pesquisa em tempo real
        document.getElementById('busca-cliente').addEventListener('input', (e) => {
            renderizarClientes(e.target.value);
        });

        // --- MODAL CLIENTE ---
        function abrirModalCliente() {
            document.getElementById('cliente-id').value = '';
            document.getElementById('input-nome').value = '';
            document.getElementById('input-telefone').value = '';
            document.getElementById('titulo-modal-cliente').innerText = 'Adicionar Cliente';
            document.getElementById('modal-cliente').classList.remove('hidden');
        }

        function fecharModalCliente() {
            document.getElementById('modal-cliente').classList.add('hidden');
        }

        function salvarCliente() {
            let nome = document.getElementById('input-nome').value.trim();
            let telefone = document.getElementById('input-telefone').value.trim();

            if (!nome) {
                alert('Informe o nome do cliente.');
                return;
            }

            let novoCliente = {
                id: Date.now().toString(),
                nome: nome,
                telefone: telefone,
                transacoes: []
            };

            dadosApp.clientes.push(novoCliente);
            salvarDados();
            fecharModalCliente();
            renderizarClientes();
        }

        // --- DETALHES E TRANSAÇÕES ---
        function renderizarDetalhesCliente() {
            let cliente = dadosApp.clientes.find(c => c.id === clienteAtualId);
            if (!cliente) return;

            document.getElementById('detalhe-nome').innerText = cliente.nome;
            document.getElementById('detalhe-telefone').innerText = cliente.telefone || 'Sem telefone cadastrado';
            
            let saldo = calcularSaldoCliente(cliente);
            let elDivida = document.getElementById('detalhe-divida');
            elDivida.innerText = formatarMoeda(saldo);
            elDivida.className = `text-lg font-bold ${saldo > 0 ? 'text-red-600' : 'text-green-600'}`;

            let listaTrans = document.getElementById('lista-transacoes');
            listaTrans.innerHTML = '';

            if (!cliente.transacoes || cliente.transacoes.length === 0) {
                listaTrans.innerHTML = `<p class="text-xs text-center text-gray-400 py-4">Nenhuma movimentação registrada.</p>`;
                return;
            }

            // Ordenar por data decrescente
            let transacoesOrdenadas = [...cliente.transacoes].reverse();

            transacoesOrdenadas.forEach(t => {
                let isCompra = t.tipo === 'compra';
                let div = document.createElement('div');
                div.className = "flex justify-between items-center border-b border-gray-100 pb-3 last:border-0 last:pb-0";
                div.innerHTML = `
                    <div>
                        <p class="text-sm font-semibold text-gray-800">${t.descricao}</p>
                        <p class="text-xs text-gray-400">${t.data}</p>
                    </div>
                    <span class="text-sm font-bold ${isCompra ? 'text-red-600' : 'text-green-600'}">
                        ${isCompra ? '+' : '-'}${formatarMoeda(t.valor)}
                    </span>
                `;
                listaTrans.appendChild(div);
            });
        }

        // --- MODAL COMPRA (FIADO) ---
        function abrirModalNovaCompra() {
            document.getElementById('input-descricao-compra').value = '';
            document.getElementById('input-valor-compra').value = '';
            document.getElementById('modal-compra').classList.remove('hidden');
        }
        function fecharModalNovaCompra() {
            document.getElementById('modal-compra').classList.add('hidden');
        }
        function salvarCompra() {
            let descricao = document.getElementById('input-descricao-compra').value.trim();
            let valor = parseFloat(document.getElementById('input-valor-compra').value);

            if (!descricao || isNaN(valor) || valor <= 0) {
                alert('Preencha a descrição e um valor válido.');
                return;
            }

            let cliente = dadosApp.clientes.find(c => c.id === clienteAtualId);
            cliente.transacoes.push({
                tipo: 'compra',
                descricao: descricao,
                valor: valor,
                data: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
            });

            salvarDados();
            fecharModalNovaCompra();
            renderizarDetalhesCliente();
        }

        // --- MODAL PAGAMENTO ---
        function abrirModalPagamento() {
            document.getElementById('input-valor-pagamento').value = '';
            document.getElementById('modal-pagamento').classList.remove('hidden');
        }
        function fecharModalPagamento() {
            document.getElementById('modal-pagamento').classList.add('hidden');
        }
        function salvarPagamento() {
            let valor = parseFloat(document.getElementById('input-valor-pagamento').value);

            if (isNaN(valor) || valor <= 0) {
                alert('Informe um valor de pagamento válido.');
                return;
            }

            let cliente = dadosApp.clientes.find(c => c.id === clienteAtualId);
            cliente.transacoes.push({
                tipo: 'pagamento',
                descricao: 'Pagamento efetuado',
                valor: valor,
                data: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
            });

            salvarDados();
            fecharModalPagamento();
            renderizarDetalhesCliente();
        }

        // --- CONFIGURAÇÕES & BACKUP ---
        function abrirModalConfig() {
            document.getElementById('modal-config').classList.remove('hidden');
        }
        function fecharModalConfig() {
            document.getElementById('modal-config').classList.add('hidden');
        }
        function exportarDados() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dadosApp));
            let downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "backup_fiado_app.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Inicializar App
        atualizarDashboard();
    </script>
</body>
</html>
