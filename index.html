<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePlay - Filmes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; }
        .screen { display: none; width: 100vw; height: 100vh; }
        .screen.active { display: flex; }

        /* LOGIN */
        #login-screen { justify-content: center; align-items: center; background: linear-gradient(135deg, #1f1f1f, #0a0a0a); padding: 20px; }
        .login-card { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        .login-card h2 { margin-bottom: 5px; color: #e50914; }
        .login-card p { color: #aaa; margin-bottom: 20px; font-size: 13px; }
        .input-group { position: relative; margin-bottom: 15px; text-align: left; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #777; }
        .input-group input { width: 100%; padding: 12px 12px 12px 45px; background: #2a2a2a; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 15px; outline: none; }
        .input-group input:focus { border-color: #e50914; }
        #login-btn { width: 100%; padding: 12px; background: #e50914; border: none; border-radius: 6px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        #login-btn:hover { background: #f40612; }
        .error-msg { color: #e50914; margin-top: 15px; font-size: 13px; }

        /* APP PRINCIPAL */
        #app-screen { flex-direction: column; }
        header { height: 70px; background: #181818; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #282828; }
        .logo { font-size: 22px; font-weight: bold; color: #e50914; }
        .search-box { position: relative; width: 50%; max-width: 400px; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #777; }
        .search-box input { width: 100%; padding: 8px 8px 8px 38px; background: #2a2a2a; border: none; border-radius: 20px; color: #fff; outline: none; }
        .logout-btn { background: transparent; border: none; color: #aaa; font-size: 18px; cursor: pointer; }
        .logout-btn:hover { color: #fff; }

        main { flex: 1; padding: 20px; overflow-y: auto; }
        main h2 { margin-bottom: 20px; font-size: 20px; }
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .movie-card { background: #1e1e1e; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .movie-card:hover { transform: scale(1.05); }
        .movie-card img { width: 100%; height: 200px; object-fit: cover; }
        .movie-info { padding: 10px; }
        .movie-info h3 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* MODAL */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .modal-content { background: #1e1e1e; padding: 20px; border-radius: 10px; width: 92%; max-width: 650px; position: relative; }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 28px; cursor: pointer; color: #aaa; }
        .close-btn:hover { color: #fff; }
        #modal-details video { width: 100%; max-height: 400px; border-radius: 6px; margin-top: 15px; background: #000; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN FIXA (ADMIN / 123) -->
    <div id="login-screen" class="screen active">
        <div class="login-card">
            <h2><i class="fa-solid fa-film"></i> CinePlay</h2>
            <p>Faça login para acessar os filmes</p>
            
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" placeholder="Usuário" value="admin">
            </div>
            
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Senha" value="123">
            </div>

            <button id="login-btn" onclick="fazerLogin()">Entrar</button>
            <p id="login-error" class="error-msg"></p>
        </div>
    </div>

    <!-- TELA PRINCIPAL -->
    <div id="app-screen" class="screen">
        <header>
            <div class="logo">CinePlay</div>
            <div class="search-box">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="search-input" placeholder="Pesquisar filmes..." oninput="filtrarFilmes()">
            </div>
            <button class="logout-btn" onclick="fazerLogout()" title="Sair"><i class="fa-solid fa-right-from-bracket"></i></button>
        </header>

        <main>
            <h2 id="section-title">Filmes Disponíveis</h2>
            <div id="movies-grid" class="movies-grid"></div>
        </main>
    </div>

    <!-- MODAL DO PLAYER -->
    <div id="player-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="fecharModal()">&times;</span>
            <div id="modal-details"></div>
        </div>
    </div>

    <script>
        // Link da sua fonte de filmes embutido no código de forma fixa
        const URL_FONTE_FILMES = "http://painelfull.st-m.shop/get.php?username=459063&password=762943&type=m3u_plus&output=ts";
        let listaFilmes = [];

        async function fazerLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('login-error');

            if(user !== "admin" || pass !== "123") {
                errorMsg.innerText = "Usuário ou senha incorretos! Use admin / 123";
                return;
            }

            errorMsg.innerText = "Carregando filmes do servidor...";

            try {
                // Proxy CORS para leitura segura no navegador e no APK WebView sem travamentos
                const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(URL_FONTE_FILMES);
                const resposta = await fetch(proxyUrl);
                
                if(!resposta.ok) throw new Error("Erro de conexão com o servidor.");
                
                const textoM3U = await resposta.text();
                listaFilmes = parseM3U(textoM3U);

                if(listaFilmes.length === 0) {
                    errorMsg.innerText = "A lista retornou vazia.";
                    return;
                }

                errorMsg.innerText = "";
                document.getElementById('login-screen').classList.remove('active');
                document.getElementById('app-screen').classList.add('active');
                document.getElementById('section-title').innerText = `Filmes Disponíveis (${listaFilmes.length})`;
                carregarFilmes(listaFilmes);

            } catch (err) {
                console.error(err);
                errorMsg.innerText = "Erro ao carregar a fonte de filmes.";
            }
        }

        function fazerLogout() {
            document.getElementById('app-screen').classList.remove('active');
            document.getElementById('login-screen').classList.active = false;
            document.getElementById('login-screen').classList.add('active');
            document.getElementById('modal-details').innerHTML = "";
        }

        // Leitor otimizado focado em extrair o título, a capa (tvg-logo) e o link direto do vídeo
        function parseM3U(conteudo) {
            const linhas = conteudo.split('\n');
            let filmes = [];
            let filmeAtual = null;

            for (let i = 0; i < linhas.length; i++) {
                let linha = linhas[i].trim();

                if (linha.startsWith('#EXTINF:')) {
                    filmeAtual = {};
                    
                    // Extrai o título do filme após a última vírgula
                    let partes = linha.split(',');
                    filmeAtual.titulo = partes.length > 1 ? partes[partes.length - 1].trim() : "Filme";

                    // Extrai a capa
                    let matchLogo = linha.match(/tvg-logo="([^"]+)"/);
                    filmeAtual.capa = (matchLogo && matchLogo[1]) ? matchLogo[1] : "https://via.placeholder.com/300x450?text=Sem+Capa";

                } else if (linha && !linha.startsWith('#') && filmeAtual) {
                    // Força o link de saída para MP4/container compatível com WebView do Android para evitar tela preta
                    let urlVideo = linha;
                    if(urlVideo.includes('output=ts')) {
                        urlVideo = urlVideo.replace('output=ts', 'output=m3u8'); // Tenta stream adaptativo mais seguro para mobile
                    }
                    
                    filmeAtual.url = urlVideo;
                    if (filmeAtual.titulo && filmeAtual.url) {
                        filmes.push(filmeAtual);
                    }
                    filmeAtual = null;
                }
            }
            return filmes;
        }

        function carregarFilmes(filmes) {
            const grid = document.getElementById('movies-grid');
            grid.innerHTML = "";

            filmes.forEach((filme) => {
                const card = document.createElement('div');
                card.classList.add('movie-card');
                card.innerHTML = `
                    <img src="${filme.capa}" alt="${filme.titulo}" onerror="this.src='https://via.placeholder.com/300x450?text=Capa+Indisponivel'">
                    <div class="movie-info">
                        <h3>${filme.titulo}</h3>
                    </div>
                `;
                card.onclick = () => abrirFilme(filme);
                grid.appendChild(card);
            });
        }

        function filtrarFilmes() {
            const termo = document.getElementById('search-input').value.toLowerCase();
            const filtrados = listaFilmes.filter(f => f.titulo.toLowerCase().includes(termo));
            carregarFilmes(filtrados);
        }

        function abrirFilme(filme) {
            const modal = document.getElementById('player-modal');
            const details = document.getElementById('modal-details');
            
            details.innerHTML = `
                <h3 style="margin-bottom: 10px; font-size: 15px; color: #fff;">${filme.titulo}</h3>
                <video controls autoplay playsinline>
                    <source src="${filme.url}" type="video/mp4">
                    Seu dispositivo não suporta a reprodução deste formato.
                </video>
            `;
            modal.style.display = "flex";
        }

        function fecharModal() {
            const modal = document.getElementById('player-modal');
            const details = document.getElementById('modal-details');
            details.innerHTML = ""; 
            modal.style.display = "none";
        }
    </script>
</body>
</html>
