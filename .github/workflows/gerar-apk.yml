name: Gerar APK Profissional

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome do Aplicativo'
        required: true
        default: 'Meu App'
      panel_url:
        description: 'URL do Painel (modo link)'
        required: false
        default: ''
      enviou_logo:
        description: 'Enviou logo? (sim/nao)'
        required: false
        default: 'nao'
      firebase_sender_id:
        description: 'Firebase Sender ID (para notificações)'
        required: false
        default: ''
      arquivo_zip:
        description: 'URL do arquivo ZIP do projeto'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependências do Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          npm install @capacitor/local-notifications@5
          npm install @capacitor/push-notifications@5

      - name: Baixar e extrair arquivo ZIP (se enviado)
        if: ${{ inputs.arquivo_zip != '' }}
        run: |
          echo "Baixando arquivo ZIP do projeto..."
          wget -O projeto.zip "${{ inputs.arquivo_zip }}" || true
          
          if [ -f projeto.zip ]; then
            echo "Arquivo baixado com sucesso!"
            ls -la projeto.zip
            mkdir -p projeto_extraido
            unzip -o projeto.zip -d projeto_extraido || true
            echo "Conteúdo extraído:"
            find projeto_extraido -maxdepth 3 -type f | head -30
            
            mkdir -p www
            
            if [ -f projeto_extraido/index.html ]; then
              echo "index.html encontrado na raiz do zip"
              cp -r projeto_extraido/* www/
            else
              INDEX_PATH=$(find projeto_extraido -name "index.html" -type f | head -1)
              if [ -n "$INDEX_PATH" ]; then
                PASTA=$(dirname "$INDEX_PATH")
                echo "index.html encontrado em: $PASTA"
                cp -r "$PASTA"/* www/
              else
                echo "⚠️ index.html não encontrado no ZIP! Usando arquivo do repositório."
                [ -f index.html ] && cp index.html www/
                [ -f style.css ] && cp style.css www/
                [ -f script.js ] && cp script.js www/
              fi
            fi
            rm -rf projeto_extraido projeto.zip
          else
            echo "Falha ao baixar ZIP. Usando arquivos do repositório."
            mkdir -p www
            [ -f index.html ] && cp index.html www/
            [ -f style.css ] && cp style.css www/
            [ -f script.js ] && cp script.js www/
          fi

      - name: Copiar arquivos para pasta www (se não veio ZIP)
        if: ${{ inputs.arquivo_zip == '' }}
        run: |
          mkdir -p www
          [ -f index.html ] && cp index.html www/
          [ -f style.css ] && cp style.css www/
          [ -f script.js ] && cp script.js www/
          
          if [ -n "${{ inputs.panel_url }}" ]; then
            echo "Modo LINK ativado: ${{ inputs.panel_url }}"
            cat > www/index.html <<ENDOFHTML
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<iframe src="${{ inputs.panel_url }}" allow="fullscreen; camera; microphone; geolocation; autoplay"></iframe>
</body>
</html>
ENDOFHTML
          fi

      - name: Injetar tags no index.html
        run: |
          if [ -f www/index.html ]; then
            if ! grep -q "viewport" www/index.html; then
              sed -i 's/<head>/<head>\n<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">/' www/index.html
            fi
            echo "index.html preparado!"
          else
            echo "ERRO: www/index.html não existe!"
            ls -la www/
            exit 1
          fi

      - name: Listar conteúdo da pasta www
        run: |
          echo "=== CONTEÚDO DA PASTA WWW ==="
          ls -la www/
          echo "============================="

      - name: Inicializar e configurar Capacitor
        run: |
          APP_NAME="${{ inputs.app_name }}"
          APP_ID=$(echo "com.nexusapk.${APP_NAME,,}" | sed 's/ /-/g; s/[^a-z0-9.-]//g')
          
          echo "APP_NAME: $APP_NAME"
          echo "APP_ID: $APP_ID"
          
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          
          # Montar capacitor.config.json
          FIREBASE_ID="${{ inputs.firebase_sender_id }}"
          
          if [ -n "$FIREBASE_ID" ]; then
            cat > capacitor.config.json <<ENDOFCONFIG
{
  "appId": "$APP_ID",
  "appName": "$APP_NAME",
  "webDir": "www",
  "bundledWebRuntime": false,
  "android": {
    "allowMixedContent": true
  },
  "plugins": {
    "LocalNotifications": {
      "smallIcon": "ic_stat_icon_config_sample",
      "iconColor": "#8b5cf6",
      "sound": "beep.wav"
    },
    "PushNotifications": {
      "presentationOptions": ["badge", "sound", "alert"],
      "senderId": "$FIREBASE_ID"
    }
  }
}
ENDOFCONFIG
          else
            cat > capacitor.config.json <<ENDOFCONFIG
{
  "appId": "$APP_ID",
  "appName": "$APP_NAME",
  "webDir": "www",
  "bundledWebRuntime": false,
  "android": {
    "allowMixedContent": true
  },
  "plugins": {
    "LocalNotifications": {
      "smallIcon": "ic_stat_icon_config_sample",
      "iconColor": "#8b5cf6",
      "sound": "beep.wav"
    }
  }
}
ENDOFCONFIG
          fi
          
          echo "=== capacitor.config.json ==="
          cat capacitor.config.json

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Configurar permissões no AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "=== AndroidManifest original ==="
          grep -n "uses-permission" "$MANIFEST"
          
          # Adiciona permissões logo após a permissão INTERNET
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>/' "$MANIFEST"
          fi
          
          echo "=== AndroidManifest com permissões ==="
          grep -n "uses-permission" "$MANIFEST"

      - name: Registrar plugins no MainActivity.java
        run: |
          MAIN_FILE=$(find android/app/src/main/java -name "MainActivity.java" | head -1)
          echo "Arquivo MainActivity: $MAIN_FILE"
          
          if [ -f "$MAIN_FILE" ]; then
            echo "=== Conteúdo original ==="
            cat "$MAIN_FILE"
            
            # Cria um novo MainActivity.java do zero, mais seguro
            PACKAGE_LINE=$(head -1 "$MAIN_FILE")
            
            cat > "$MAIN_FILE" <<ENDOFJAVA
$PACKAGE_LINE

import android.os.Bundle;
import com.getcapacitor.BridgeActivity;
import com.getcapacitor.Plugin;
import com.capacitorjs.plugins.localnotifications.LocalNotificationsPlugin;
import com.capacitorjs.plugins.pushnotifications.PushNotificationsPlugin;
import java.util.ArrayList;

public class MainActivity extends BridgeActivity {
    @Override
    public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        registerPlugin(LocalNotificationsPlugin.class);
        registerPlugin(PushNotificationsPlugin.class);
    }
}
ENDOFJAVA
            
            echo "=== Novo MainActivity.java ==="
            cat "$MAIN_FILE"
          else
            echo "⚠️ MainActivity.java não encontrado!"
            find android/app/src/main/java -type f
          fi

      - name: Gerar ícones do app (se logo enviada)
        if: ${{ inputs.enviou_logo == 'sim' }}
        run: |
          if [ -f logo.png ]; then
            echo "Gerando ícones a partir de logo.png..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
            
            mkdir -p android/app/src/main/res/mipmap-mdpi
            mkdir -p android/app/src/main/res/mipmap-hdpi
            mkdir -p android/app/src/main/res/mipmap-xhdpi
            mkdir -p android/app/src/main/res/mipmap-xxhdpi
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            
            convert logo.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert logo.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert logo.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert logo.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert logo.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            
            convert logo.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            convert logo.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            convert logo.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            convert logo.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            convert logo.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            
            echo "Ícones gerados com sucesso!"
          else
            echo "logo.png não encontrado, usando ícones padrão."
          fi

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
          echo "=== APKs gerados ==="
          find . -name "*.apk" -type f

      - name: Mover APK para pasta de saída
        run: |
          mkdir -p apk_output
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -f "$APK_FILE" ]; then
            APP_NAME_CLEAN=$(echo "${{ inputs.app_name }}" | sed 's/[^a-zA-Z0-9_-]/_/g')
            cp "$APK_FILE" "apk_output/${APP_NAME_CLEAN}.apk"
            echo "APK movido: apk_output/${APP_NAME_CLEAN}.apk"
            ls -la apk_output/
          else
            echo "ERRO: APK não encontrado!"
            exit 1
          fi

      - name: Salvar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-gerado
          path: apk_output/*.apk
          retention-days: 1
