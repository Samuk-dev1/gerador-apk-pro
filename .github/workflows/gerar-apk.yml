name: Gerar APK Prático

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome do Aplicativo'
        required: true
        default: 'MeuApp'
      enviou_logo:
        description: 'Usuário enviou logo?'
        required: false
        default: 'nao'
      panel_url:
        description: 'URL do Painel (modo link)'
        required: false
        default: ''
      firebase_sender_id:
        description: 'Firebase Sender ID'
        required: false
        default: ''
      arquivo_zip:
        description: 'URL do arquivo ZIP'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do projeto
      uses: actions/checkout@v4

    - name: Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Preparar Ambiente e Gerar
      run: |
        npm init -y
        
        # Versão 5 Estável
        npm install @capacitor/core@5 @capacitor/android@5 @capacitor/cli@5
        
        # ====== ADICIONADO: Plugins de Notificação ======
        npm install @capacitor/local-notifications@5
        npm install @capacitor/push-notifications@5
        # ===============================================
        
        mkdir -p www
        
        # ====== ADICIONADO: Suporte a arquivo ZIP ======
        ARQUIVO_ZIP="${{ github.event.inputs.arquivo_zip }}"
        if [ -n "$ARQUIVO_ZIP" ]; then
          echo "Baixando arquivo ZIP do projeto..."
          wget -q -O projeto.zip "$ARQUIVO_ZIP" || true
          if [ -f projeto.zip ]; then
            mkdir -p temp_zip
            unzip -q -o projeto.zip -d temp_zip || true
            IDX=$(find temp_zip -name "index.html" -type f | head -1)
            if [ -n "$IDX" ]; then
              DIR=$(dirname "$IDX")
              cp -r "$DIR"/* www/
              echo "Arquivos copiados do ZIP com sucesso!"
            fi
            rm -rf temp_zip projeto.zip
          fi
        fi
        # ===============================================
        
        # Se não veio ZIP ou não tem arquivos, copia do repositório
        if [ ! -f www/index.html ]; then
          cp index.html www/index.html
          [ -f style.css ] && cp style.css www/style.css
          [ -f script.js ] && cp script.js www/script.js
        fi
        
        # ====== ADICIONADO: Modo Link ======
        PANEL_URL="${{ github.event.inputs.panel_url }}"
        if [ -n "$PANEL_URL" ]; then
          echo "Modo LINK ativado: $PANEL_URL"
          cat > www/index.html <<FIMDOHTML
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>*{margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000}iframe{width:100%;height:100%;border:none}</style>
</head>
<body>
<iframe src="$PANEL_URL" allow="fullscreen; camera; microphone; geolocation; autoplay"></iframe>
</body>
</html>
FIMDOHTML
        fi
        # ===============================================
        
        # SÓ APAGA SE O USUÁRIO DE FATO NÃO TIVER ENVIADO NENHUMA LOGO
        ENVIOU_LOGO="${{ github.event.inputs.enviou_logo }}"
        if [ "$ENVIOU_LOGO" = "nao" ]; then
          echo "Nenhuma logo nova foi enviada. Limpando a logo do cliente anterior..."
          rm -f logo.png
        fi
        
        APP_NAME="${{ github.event.inputs.app_name }}"
        
        # Cria um identificador único com base no nome digitado para evitar conflitos no Android
        APP_ID=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]')
        if [ -z "$APP_ID" ]; then
          APP_ID="app"
        fi
        
        # Inicializa o Capacitor usando o ID único gerado
        npx cap init "$APP_NAME" com.gerador.$APP_ID --web-dir www
        npx cap add android

        # Aplica o nome exato no arquivo de strings nativo do Android
        STRINGS_FILE="android/app/src/main/res/values/strings.xml"
        if [ -f "$STRINGS_FILE" ]; then
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/" "$STRINGS_FILE"
        fi
        
        # ====== ADICIONADO: Permissões de Notificação ======
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ] && ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
          echo "Adicionando permissões de notificação..."
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>/' "$MANIFEST"
        fi
        # ====================================================
        
        # ====== ADICIONADO: Registrar plugins no MainActivity ======
        MAIN_FILE=$(find android/app/src/main/java -name "MainActivity.java" | head -1)
        if [ -f "$MAIN_FILE" ]; then
          echo "Registrando plugins de notificação no MainActivity..."
          PACKAGE_LINE=$(head -1 "$MAIN_FILE")
          cat > "$MAIN_FILE" <<FIMDOJAVA
$PACKAGE_LINE

import android.os.Bundle;
import com.getcapacitor.BridgeActivity;
import com.capacitorjs.plugins.localnotifications.LocalNotificationsPlugin;
import com.capacitorjs.plugins.pushnotifications.PushNotificationsPlugin;

public class MainActivity extends BridgeActivity {
    @Override
    public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        registerPlugin(LocalNotificationsPlugin.class);
        registerPlugin(PushNotificationsPlugin.class);
    }
}
FIMDOJAVA
        fi
        # ===========================================================

        # Se o usuário enviou uma logo nova, ajusta ela automaticamente para o padrão de ícones do Android
        if [ -f logo.png ]; then
          echo "Logo personalizada encontrada! Otimizando e redimensionando automaticamente..."
          
          # Instala ferramenta leve de imagem no Ubuntu para redimensionar sem pesar o app
          sudo apt-get update && sudo apt-get install -y imagemagick > /dev/null 2>&1
          
          # Cria os tamanhos exatos exigidos pelo Android em cada pasta mipmap
          mkdir -p android/app/src/main/res/mipmap-mdpi
          convert logo.png -resize 48x48! android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert logo.png -resize 48x48! android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          mkdir -p android/app/src/main/res/mipmap-hdpi
          convert logo.png -resize 72x72! android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert logo.png -resize 72x72! android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          mkdir -p android/app/src/main/res/mipmap-xhdpi
          convert logo.png -resize 96x96! android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert logo.png -resize 96x96! android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          convert logo.png -resize 144x144! android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert logo.png -resize 144x144! android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          convert logo.png -resize 192x192! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert logo.png -resize 192x192! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          # Remove os arquivos XML antigos do Android para forçar o uso da imagem PNG nova
          find android/app/src/main/res/ -name "ic_launcher.xml" -delete
          find android/app/src/main/res/ -name "ic_launcher_round.xml" -delete
        fi

        npx cap sync android

    - name: Compilar APK de Debug
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Salvar o APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: meu-aplicativo-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 1
