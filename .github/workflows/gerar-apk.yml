name: Gerar APK IPTV com Notificações
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome do Aplicativo'
        required: true
        default: 'Meu Sistema IPTV'
      panel_url:
        description: 'Link do Painel/Projeto (deixe vazio se enviar o ZIP)'
        required: false
        default: ''
      enviou_logo:
        description: 'Usuário enviou logo?'
        required: false
        default: 'nao'
      firebase_sender_id:
        description: 'ID do Remetente Firebase (para notificações)'
        required: true
        default: 'SEU_ID_AQUI'
      arquivo_zip:
        description: 'Link ou caminho do ZIP do projeto (se não usar link)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar arquivos do repositório
      uses: actions/checkout@v4

    - name: Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Baixar e extrair ZIP do Projeto (se enviado)
      if: ${{ inputs.arquivo_zip != '' }}
      run: |
        echo "📦 Baixando projeto enviado por ZIP..."
        wget -O projeto_completo.zip "${{ inputs.arquivo_zip }}"
        unzip -o projeto_completo.zip -d .
        rm projeto_completo.zip

    - name: Instalar dependências e preparar
      run: |
        npm init -y
        npm install @capacitor/core@5 @capacitor/android@5 @capacitor/cli@5 @capacitor/push-notifications@5

        mkdir -p www
        # Copia arquivos do projeto
        [ -f index.html ] && cp index.html www/ || touch www/index.html
        [ -f style.css ] && cp style.css www/ || touch www/style.css
        [ -f script.js ] && cp script.js www/ || touch www/script.js

        # Insere CSS e JS automaticamente no HTML
        if grep -q "<head>" www/index.html && ! grep -q "style.css" www/index.html; then
          sed -i 's|<head>|<head>\n    <link rel="stylesheet" href="style.css">|' www/index.html
        fi
        if grep -q "</body>" www/index.html && ! grep -q "script.js" www/index.html; then
          sed -i 's|</body>|    <script src="script.js"></script>\n</body>|' www/index.html
        fi

        # Limpa logo se não foi enviada
        if [ "${{ inputs.enviou_logo }}" = "nao" ]; then rm -f logo.png; fi

        # Gera ID único do app
        APP_NAME="${{ inputs.app_name }}"
        APP_ID=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]')
        [ -z "$APP_ID" ] && APP_ID="appiptv"

        # Inicializa Capacitor com Push Notifications
        npx cap init "$APP_NAME" com.iptv.$APP_ID --web-dir www
        npx cap add android

    - name: Configurar Notificações Firebase e Permissões
      run: |
        # Atualiza capacitor.config.json com Push
        node -e '
          const fs = require("fs");
          let config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
          
          const PANEL_URL = process.argv[1];
          if(PANEL_URL && PANEL_URL.trim() !== ""){
            config.server = { "url": PANEL_URL, "cleartext": true };
          } else {
            delete config.server;
          }

          config.android = {
            "allowMixedContent": true,
            "webContentsDebuggingEnabled": true
          };

          config.plugins = {
            "PushNotifications": {
              "senderId": process.argv[2]
            }
          };

          fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
        ' "${{ inputs.panel_url }}" "${{ inputs.firebase_sender_id }}"

        # Adiciona permissões no AndroidManifest.xml
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        sed -i '/<manifest /a xmlns:tools="http://schemas.android.com/tools"' "$MANIFEST"
        sed -i '/<application /a tools:replace="android:allowBackup"' "$MANIFEST"
        
        # Insere permissões de notificação e internet
        grep -q "POST_NOTIFICATIONS" "$MANIFEST" || sed -i '/<uses-permission/a <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
        grep -q "INTERNET" "$MANIFEST" || sed -i '/<uses-permission/a <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
        grep -q "VIBRATE" "$MANIFEST" || sed -i '/<uses-permission/a <uses-permission android:name="android.permission.VIBRATE" />' "$MANIFEST"

    - name: Aplicar Ícone Personalizado
      run: |
        if [ -f logo.png ]; then
          sudo apt update && sudo apt install -y imagemagick > /dev/null 2>&1
          for size in 48 72 96 144 192; do
            mkdir -p android/app/src/main/res/mipmap-${size/48/mdpi}/${size/72/hdpi}/${size/96/xhdpi}/${size/144/xxhdpi}/${size/192/xxxhdpi}
            convert logo.png -resize ${size}x${size}! android/app/src/main/res/mipmap-*/ic_launcher.png
            convert logo.png -resize ${size}x${size}! android/app/src/main/res/mipmap-*/ic_launcher_round.png
          done
          find android/app/src/main/res/ -name "ic_launcher.xml" -delete
        fi
        # Atualiza nome do app
        sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">${{ inputs.app_name }}<\/string>/" android/app/src/main/res/values/strings.xml
        npx cap sync android

    - name: Compilar APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Salvar APK Gerado
      uses: actions/upload-artifact@v4
      with:
        name: APK-IPTV-Notificacoes
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
